<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anteprima Sezione SMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --panel-bg: #0f0f12;
      --border-color: #2a2a32;
      --accent-gold: #d4af37;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cinzel', Georgia, serif;
      background: #050508;
      min-height: 100vh;
      color: #e5e5e5;
      padding: 2rem;
    }
    h1 {
      font-size: 1.25rem;
      color: var(--accent-gold);
      margin-bottom: 2rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }
    .preview-row {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .preview-block {
      flex: 0 0 280px;
    }
    .preview-block h2 {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 0.75rem;
    }
    .sms-section {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 1rem;
    }
    .sms-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.625rem 1rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border-color);
      background: rgba(0,0,0,0.3);
      color: #d1d5db;
      font-size: 0.75rem;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .sms-btn:hover {
      border-color: rgba(212, 175, 55, 0.5);
      background: rgba(255,255,255,0.05);
    }
    .sms-btn .icon { font-size: 1rem; }
    .sms-btn.vuoto .icon { color: #6b7280; }
    .sms-btn.nuovi .icon { color: var(--accent-gold); }
    .sms-btn.nuovi .text { color: #d1d5db; }
    .badge {
      position: absolute;
      top: -2px;
      right: -2px;
      min-width: 18px;
      height: 18px;
      border-radius: 9999px;
      background: var(--accent-gold);
      color: black;
      font-size: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    /* Animazione — badge e sezione con nuovi messaggi (più visibile in anteprima) */
    @keyframes sms-badge-pulse {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.3); }
      50% { opacity: 0.9; transform: scale(1.12); box-shadow: 0 0 12px 3px rgba(212, 175, 55, 0.5); }
    }
    @keyframes sms-section-glow {
      0%, 100% { box-shadow: inset 0 0 0 0 transparent; }
      50% { box-shadow: inset 0 0 20px 2px rgba(212, 175, 55, 0.15); }
    }
    .sms-section.animate { animation: sms-section-glow 3s ease-in-out infinite; }
    .badge.animate { animation: sms-badge-pulse 2.5s ease-in-out infinite; }
  </style>
</head>
<body>
  <h1>Sezione SMS — Anteprima</h1>

  <div class="preview-row">
    <div class="preview-block">
      <h2>Senza messaggi (vuoto)</h2>
      <div class="sms-section">
        <button type="button" class="sms-btn vuoto">
          <i class="fa-solid fa-envelope icon"></i>
          <span class="text">Messaggi</span>
        </button>
      </div>
    </div>

    <div class="preview-block">
      <h2>Con nuovi messaggi (3 non letti)</h2>
      <div class="sms-section animate">
        <button type="button" class="sms-btn nuovi">
          <i class="fa-solid fa-message icon"></i>
          <span class="text">3 messaggi</span>
          <span class="badge animate">3</span>
        </button>
      </div>
    </div>

    <div class="preview-block">
      <h2>Molti messaggi (99+)</h2>
      <div class="sms-section animate">
        <button type="button" class="sms-btn nuovi">
          <i class="fa-solid fa-message icon"></i>
          <span class="text">127 messaggi</span>
          <span class="badge animate">99+</span>
        </button>
      </div>
    </div>
  </div>
  <p style="margin-top: 2rem; font-size: 0.75rem; color: rgba(255,255,255,0.4);">
    ↑ Le animazioni (pulsazione badge + glow sezione) sono sui blocchi centrali e destri.
  </p>
</body>
</html>
