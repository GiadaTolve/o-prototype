<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kessen - Dark Fantasy Tactical Map</title>
  <!--
    Asset locali (Leaflet in /maps/vendor): la CSP Next blocca unpkg/Google Fonts.
    Apri: http://localhost:3000/maps/tactical-poi-mockup.html
  -->
  <link rel="stylesheet" href="/maps/vendor/leaflet/leaflet.css" />

  <style>
    :root {
      --bg-void: #050407;
      --gold-primary: #e2c07b;
      --gold-glow: #ffd700;
      --purple-aura: #8a2be2;
      --purple-dark: #2d0b4e;
      --font-main: "Palatino Linotype", Palatino, "Times New Roman", serif;
      --font-jp: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-void); font-family: var(--font-main); }

    #map { width: 100vw; height: 100vh; background: var(--bg-void); }
    .leaflet-container { background: var(--bg-void) !important; font: inherit; }

    /* Vignettatura (non copre il centro) */
    .vignette-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 400;
      background: radial-gradient(circle, transparent 40%, rgba(5, 4, 7, 0.55) 75%, rgba(0, 0, 0, 0.9) 100%);
      box-shadow: inset 0 0 80px rgba(0,0,0,0.75);
    }

    .error-banner {
      position: absolute; z-index: 500; left: 50%; top: 24px; transform: translateX(-50%);
      max-width: min(480px, calc(100% - 24px));
      padding: 12px 16px;
      background: rgba(13, 11, 16, 0.95);
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      font-size: 12px; letter-spacing: 0.08em; text-align: center;
      display: none;
    }

    /* --- EFFETTI GLOW SUI POI --- */

    .city-node { display: flex; justify-content: center; align-items: center; background: transparent !important; border: none !important; }
    .city-core {
      width: 10px; height: 10px;
      background: #ffffff;
      transform: rotate(45deg);
      border: 1px solid var(--gold-glow);
      box-shadow: 0 0 10px var(--gold-glow), 0 0 20px #ff8c00, 0 0 40px #ff4500;
      animation: pulse-game 1.8s infinite ease-in-out;
    }

    @keyframes pulse-game {
      0% { transform: rotate(45deg) scale(0.8); box-shadow: 0 0 8px var(--gold-glow), 0 0 15px #ff8c00; }
      50% { transform: rotate(45deg) scale(1.3); box-shadow: 0 0 18px var(--gold-glow), 0 0 35px var(--gold-glow); }
      100% { transform: rotate(45deg) scale(0.8); box-shadow: 0 0 8px var(--gold-glow), 0 0 15px #ff8c00; }
    }

    .temple-node { display: flex; justify-content: center; align-items: center; background: transparent !important; border: none !important; }
    .temple-core {
      width: 24px; height: 24px;
      border: 1px solid var(--purple-aura);
      background: rgba(45, 11, 78, 0.6);
      border-radius: 50%;
      color: var(--gold-primary);
      font-size: 13px; font-family: var(--font-jp);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 15px var(--purple-aura), inset 0 0 10px var(--purple-aura);
      transition: all 0.3s;
    }
    .temple-core:hover { transform: scale(1.25); box-shadow: 0 0 25px #c084fc; }

    .academy-node { display: flex; justify-content: center; align-items: center; background: transparent !important; border: none !important; }
    .academy-core {
      width: 20px; height: 20px;
      border: 1px solid var(--gold-primary);
      background: rgba(13, 11, 16, 0.9);
      color: var(--gold-primary);
      font-size: 10px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 12px var(--gold-primary);
    }

    .leaflet-tooltip-dark {
      background: rgba(8, 7, 10, 0.95) !important;
      border: 1px solid var(--gold-primary) !important;
      color: #d1d5db !important;
      font-family: var(--font-main) !important;
      font-size: 10px !important;
      letter-spacing: 2px !important;
      padding: 10px 14px !important;
      border-radius: 0 !important;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 10px rgba(226, 192, 123, 0.2) !important;
    }
    .leaflet-tooltip-dark b { color: var(--gold-glow); font-size: 12px; display: block; margin-bottom: 2px; }
    .leaflet-tooltip-dark .jp { font-family: var(--font-jp); color: var(--purple-aura); }
    .leaflet-tooltip-dark::before { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .city-core { animation: none; }
    }
  </style>
</head>
<body>

  <div class="vignette-overlay"></div>
  <div id="map"></div>
  <div id="error" class="error-banner"></div>

  <script src="/maps/vendor/leaflet/leaflet.js"></script>
  <script src="/maps/vendor/leaflet/leaflet-ant-path.min.js"></script>

  <script>
    function showError(msg) {
      var el = document.getElementById("error");
      el.style.display = "block";
      el.textContent = msg;
    }

    if (typeof L === "undefined") {
      showError("Leaflet non caricato. Controlla /maps/vendor/leaflet/leaflet.js");
    } else {
      const map = L.map("map", {
        center: [35.6762, 139.6503],
        zoom: 11,
        zoomControl: false,
        attributionControl: false,
        minZoom: 9,
        maxZoom: 15
      });

      // Basemap scuro (CartoDB Dark Matter) — senza questo il void resta nero pieno
      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        subdomains: "abcd",
        maxZoom: 19
      }).addTo(map);

      /* --- 1. CENTRO ABITATO --- */
      const cityArea = [
        [35.73, 139.58], [35.76, 139.78],
        [35.68, 139.88], [35.58, 139.75],
        [35.61, 139.58]
      ];

      L.polygon(cityArea, {
        color: "#8a2be2",
        weight: 1,
        dashArray: "3, 6",
        fillColor: "#2d0b4e",
        fillOpacity: 0.35
      }).addTo(map);

      const cityIcon = L.divIcon({
        className: "city-node",
        html: '<div class="city-core"></div>',
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });

      const cityMarker = L.marker([35.6762, 139.6503], { icon: cityIcon }).addTo(map);
      cityMarker.bindTooltip("<b>EDO / TOKYO</b><span class='jp'>首都 - Edo</span><br>STATUS: NODO URBANO CENTRALE", {
        className: "leaflet-tooltip-dark"
      });

      /* --- 2. TEMPIO --- */
      const templeIcon = L.divIcon({
        className: "temple-node",
        html: '<div class="temple-core">⛩️</div>',
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      const templeMarker = L.marker([35.7148, 139.7967], { icon: templeIcon }).addTo(map);
      templeMarker.bindTooltip("<b>SANTUARIO DI SENSO-JI</b><span class='jp'>霊場 - Sensoji</span><br>ALLINEAMENTO: MAGIA VIOLA", {
        className: "leaflet-tooltip-dark"
      });

      /* --- 3. ACCADEMIA --- */
      const academyIcon = L.divIcon({
        className: "academy-node",
        html: '<div class="academy-core">◆</div>',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      const academyMarker = L.marker([35.7126, 139.7619], { icon: academyIcon }).addTo(map);
      academyMarker.bindTooltip("<b>SEDE ACCADEMICA</b><span class='jp'>学府 - Academe</span><br>LIVELLO RICERCA: VIII", {
        className: "leaflet-tooltip-dark"
      });

      /* --- 4. FIUME --- */
      const riverPath = [
        [35.80, 139.70], [35.75, 139.72], [35.71, 139.79], [35.65, 139.83]
      ];

      L.polyline(riverPath, {
        color: "#8a2be2",
        weight: 3,
        opacity: 0.7,
        lineCap: "round"
      }).addTo(map).bindTooltip("<b>FIUME SUMIDA</b><span class='jp'>隅田川</span>", { className: "leaflet-tooltip-dark" });

      /* --- 5. TRENO / METRO (ant-path se disponibile) --- */
      const trainRoute = [
        [35.6762, 139.6503],
        [35.7126, 139.7619],
        [35.7148, 139.7967]
      ];

      if (L.polyline.antPath) {
        L.polyline.antPath(trainRoute, {
          delay: 800,
          dashArray: [8, 20],
          color: "#ffd700",
          pulseColor: "#050407",
          weight: 2,
          hardwareAccelerated: true
        }).addTo(map);
      } else {
        L.polyline(trainRoute, {
          color: "#ffd700",
          weight: 2,
          dashArray: "8, 12",
          opacity: 0.85
        }).addTo(map);
      }

      /* --- 6. MURAGLIA --- */
      const wallPath = [
        [35.77, 139.55],
        [35.78, 139.68],
        [35.80, 139.80]
      ];

      L.polyline(wallPath, {
        color: "#e2c07b",
        weight: 2,
        dashArray: "12, 6, 2, 6"
      }).addTo(map).bindTooltip("<b>BARRIERA NORD</b><span class='jp'>防壁 - Wall</span>", { className: "leaflet-tooltip-dark" });

      map.invalidateSize();
    }
  </script>
</body>
</html>
