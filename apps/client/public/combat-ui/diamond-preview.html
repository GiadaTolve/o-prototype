<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Diamond SVG</title>
  <style>
    :root {
      --ui-bg: #0f0d12;
      --ui-line: #4a4550;
      --ui-thick: 3;
      --ui-thin: 1;
    }
    body {
      background: #080408;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 140 140" width="280" height="280">
    <polygon
      points="70,10 130,70 70,130 10,70"
      fill="var(--ui-bg)"
      stroke="var(--ui-line)"
      stroke-width="var(--ui-thick)"
    />
    <polygon
      points="70,35 105,70 70,105 35,70"
      fill="none"
      stroke="var(--ui-line)"
      stroke-width="var(--ui-thin)"
    />
  </svg>
</body>
</html>
